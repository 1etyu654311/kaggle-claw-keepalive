name: 🦅 Claw Agent KeepAlive

on:
  schedule:
    # اختبار: كل 3 دقائق — لو الوكيل وقف، يعيد تشغيله
    - cron: "*/3 * * * *"
  workflow_dispatch:   # تشغيل يدوي من GitHub

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaggle CLI
        run: pip install -q kaggle

      - name: Check & restart agent
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          CLAW_TG_TOKEN: ${{ secrets.CLAW_TG_TOKEN }}
          CLAW_TG_ALLOW: ${{ secrets.CLAW_TG_ALLOW }}
        run: python keepalive.py